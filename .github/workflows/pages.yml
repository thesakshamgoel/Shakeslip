# GitHub Pages only forwards visitors to the live app (see deploy/README.md). Change the address in deploy/pages/index.html.
name: Pages
on:
  push:
    branches: [main]
    paths: ['deploy/pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # the same page answers deep links
      - run: cp deploy/pages/index.html deploy/pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: deploy/pages }
      - id: d
        uses: actions/deploy-pages@v4
