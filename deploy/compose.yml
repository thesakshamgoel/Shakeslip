# Shakeslip on one Linux server: the app plus Caddy for automatic HTTPS.
# Run from this folder: docker compose up -d --build
services:
  app:
    build:
      context: ..
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?set it in deploy/.env}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?set it in deploy/.env}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?set it in deploy/.env}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?set it in deploy/.env}
    environment:
      APP_URL: https://${DOMAIN:?set it in deploy/.env}
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Shakeslip <no-reply@example.com>}
    volumes:
      - data:/data
    restart: unless-stopped
    logging: &logging
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # The app opens its own public address to render PDFs. The alias keeps that traffic inside Docker.
    networks:
      default:
        aliases:
          - ${DOMAIN}
    depends_on: [app]
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:
