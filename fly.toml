app = "shakeslip"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_FIREBASE_API_KEY = "AIzaSyC4P9VHD51dlxfEky9mjSfc4vE5M5_wwMw"
    VITE_FIREBASE_AUTH_DOMAIN = "shakeslip.firebaseapp.com"
    VITE_FIREBASE_PROJECT_ID = "shakeslip"
    VITE_FIREBASE_APP_ID = "1:437281079346:web:0550e5d22be298bb093c2b"

[env]
  FIREBASE_PROJECT_ID = "shakeslip"
  APP_URL = "https://shakeslip.fly.dev"

[mounts]
  source = "shakeslip_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.checks]
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
