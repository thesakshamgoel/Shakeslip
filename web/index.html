<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Shakeslip Studio and Slip: create invoices, and receive them." />
    <link rel="icon" type="image/svg+xml" href="/brand/shakeslip.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Shakeslip</title>
    <script>
      try {
        var t = localStorage.getItem('ss-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="splash-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
